<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>系统模块拆分图 - 心迹花园</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f5f7;
    font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", sans-serif;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .red-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e03e3e;
    flex: none;
  }
  .toolbar .title {
    font-size: 22px;
    font-weight: 700;
    color: #3a3f47;
    letter-spacing: 2px;
  }
  .spacer { flex: 1; }
  .toolbar button {
    padding: 6px 16px;
    border: 1px solid #c9ccd2;
    border-radius: 4px;
    background: #fff;
    color: #444;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: #4a90e2; color: #4a90e2; }
  #wrap {
    margin: 18px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    overflow: auto;
  }
  svg { display: block; background: #fff; }
  .box { fill: #ffffff; stroke: #333842; stroke-width: 1.3; }
  .ln  { stroke: #333842; stroke-width: 1.3; fill: none; }
  .vtext { fill: #2f343c; font-size: 23px; }
  .mtext { fill: #2f343c; font-size: 25px; font-weight: 600; }
  .rtext { fill: #2f343c; font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    #wrap { margin: 0; border: none; overflow: visible; }
    svg { width: 100% !important; height: auto !important; }
    @page { size: A3 landscape; margin: 8mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="red-dot"></span>
    <span class="title">系统模块拆分图</span>
    <span class="spacer"></span>
    <button id="btnFit">适应宽度</button>
    <button id="btnRaw">原始大小</button>
    <button id="btnPrint">打印 / 保存PDF</button>
  </div>
  <div id="wrap">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

<script>
/* ========== 模块数据（与 routes / views 一一对应） ========== */
const tree = {
  name: "心迹花园",
  children: [
    { name: "用户模块", leaves: ["用户登录", "用户注册", "退出登录"] },
    { name: "AI咨询模块", leaves: ["发起会话", "流式对话", "会话管理", "情绪分析"] },
    { name: "情绪日记模块", leaves: ["日记记录"] },
    { name: "情绪周报模块", leaves: ["周报生成", "周报列表", "周报详情"] },
    { name: "情绪急救箱模块", leaves: ["练习库", "智能推荐", "练习打卡", "打卡记录", "效果统计"] },
    { name: "心理测评模块", leaves: ["量表浏览", "在线测评", "测评记录"] },
    { name: "知识库模块", leaves: ["分类导航", "文章列表", "文章详情"] },
    { name: "后台管理模块", leaves: ["数据分析", "文章管理", "咨询记录", "情绪日志"] }
  ]
};

/* ========== 布局几何 ========== */
const M = 70;                       // 画布左右边距
const leafW = 80, leafH = 192;      // 子功能框
const gapLeaf = 28;                 // 同模块内子功能间距
const gapGroup = 46;                // 模块组间距
const modW = 92, modH = 268;        // 模块框
const rootW = 380, rootH = 84;      // 顶层框
const rootY = 132;
const busY = 292;                   // 顶层横干线
const modY = 338;                   // 模块框顶
const leafBusY = 662;               // 组内横干线
const leafY = 700;                  // 子功能框顶
const bottomPad = 56;

/* ---- 计算每个叶子的横向位置 ---- */
let x = M;
const groups = tree.children.map((g) => {
  const leaves = g.leaves.map((name) => {
    const cx = x + leafW / 2;
    const node = { name, cx, x };
    x += leafW + gapLeaf;
    return node;
  });
  x -= gapLeaf; // 撤销组内最后一个间距
  const center = (leaves[0].cx + leaves[leaves.length - 1].cx) / 2;
  x += gapGroup;
  return { name: g.name, leaves, center };
});
x -= gapGroup;

const W = x + M;
const H = leafY + leafH + bottomPad;
const rootCx = W / 2;

/* ---- 生成 SVG ---- */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
svg.setAttribute("width", W);
svg.setAttribute("height", H);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

const el = (tag, attrs = {}, text) => {
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text != null) node.textContent = text;
  svg.appendChild(node);
  return node;
};

/* 竖排文字：逐字 tspan 堆叠，保证各浏览器一致 */
function verticalText(cx, topY, boxH, str, cls) {
  const fontSize = cls === "mtext" ? 25 : 23;
  const step = cls === "mtext" ? 32 : 33;
  const startY = topY + (boxH - (str.length - 1) * step) / 2 + fontSize / 3;
  const t = el("text", { x: cx, y: startY, "text-anchor": "middle", class: cls });
  [...str].forEach((ch, i) => {
    const ts = document.createElementNS(NS, "tspan");
    ts.setAttribute("x", cx);
    if (i > 0) ts.setAttribute("dy", step);
    ts.textContent = ch;
    t.appendChild(ts);
  });
}

/* ---- 连线：顶层 → 模块 ---- */
let path = `M ${rootCx} ${rootY + rootH} V ${busY}`;
path += ` M ${groups[0].center} ${busY} H ${groups[groups.length - 1].center}`;
groups.forEach((g) => {
  path += ` M ${g.center} ${busY} V ${modY}`;
  path += ` M ${g.center} ${modY + modH} V ${leafBusY}`;
  if (g.leaves.length > 1) {
    path += ` M ${g.leaves[0].cx} ${leafBusY} H ${g.leaves[g.leaves.length - 1].cx}`;
  }
  g.leaves.forEach((lf) => {
    path += ` M ${lf.cx} ${leafBusY} V ${leafY}`;
  });
});
el("path", { d: path, class: "ln" });

/* ---- 顶层框 ---- */
el("rect", { x: rootCx - rootW / 2, y: rootY, width: rootW, height: rootH, class: "box" });
el("text", {
  x: rootCx, y: rootY + rootH / 2, "text-anchor": "middle",
  "dominant-baseline": "central", class: "rtext"
}, tree.name);

/* ---- 模块框 + 子功能框 ---- */
groups.forEach((g) => {
  el("rect", { x: g.center - modW / 2, y: modY, width: modW, height: modH, class: "box" });
  verticalText(g.center, modY, modH, g.name, "mtext");
  g.leaves.forEach((lf) => {
    el("rect", { x: lf.x, y: leafY, width: leafW, height: leafH, class: "box" });
    verticalText(lf.cx, leafY, leafH, lf.name, "vtext");
  });
});

/* ---- 工具栏 ---- */
document.getElementById("btnFit").onclick = () => {
  svg.style.width = "100%";
  svg.style.height = "auto";
};
document.getElementById("btnRaw").onclick = () => {
  svg.style.width = "";
  svg.style.height = "";
};
document.getElementById("btnPrint").onclick = () => window.print();
</script>
</body>
</html>
