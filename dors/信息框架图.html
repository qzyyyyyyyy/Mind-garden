<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>信息框架图 - 心迹花园</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f7;
        font-family:
          "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", sans-serif;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .red-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e03e3e;
        flex: none;
      }
      .toolbar .title {
        font-size: 22px;
        font-weight: 700;
        color: #3a3f47;
        letter-spacing: 2px;
      }
      .spacer {
        flex: 1;
      }
      .toolbar button {
        padding: 6px 16px;
        border: 1px solid #c9ccd2;
        border-radius: 4px;
        background: #fff;
        color: #444;
        font-size: 13px;
        cursor: pointer;
      }
      .toolbar button:hover {
        border-color: #4a90e2;
        color: #4a90e2;
      }
      #wrap {
        margin: 18px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        overflow: auto;
      }
      svg {
        display: block;
        background: #fff;
      }
      @media print {
        body {
          background: #fff;
        }
        .toolbar {
          display: none;
        }
        #wrap {
          margin: 0;
          border: none;
          overflow: visible;
        }
        svg {
          width: 100% !important;
          height: auto !important;
        }
        @page {
          size: A3 landscape;
          margin: 8mm;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span class="red-dot"></span>
      <span class="title">信息框架图</span>
      <span class="spacer"></span>
      <button id="btnFit">适应宽度</button>
      <button id="btnRaw">原始大小</button>
      <button id="btnPrint">打印 / 保存PDF</button>
    </div>
    <div id="wrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <script>
      /* ========== 五层信息框架数据 ========== */
      const layers = [
        {
          name: "信息源",
          color: "#e8f4fd",
          border: "#3b82c4",
          items: [
            { name: "普通用户", sub: "心理咨询者" },
            { name: "管理员", sub: "系统运营者" }
          ]
        },
        {
          name: "信息采集",
          color: "#f0f7e8",
          border: "#5a9e3a",
          items: [
            { name: "账号信息", sub: "用户名/邮箱/密码" },
            { name: "咨询对话", sub: "会话·消息内容" },
            { name: "情绪日记", sub: "评分·情绪·触发因素" },
            { name: "急救打卡", sub: "练习·前后心情·反思" },
            { name: "测评作答", sub: "量表编码·答案" },
            { name: "知识文章", sub: "标题·分类·正文" },
            { name: "上传文件", sub: "封面图·附件" }
          ]
        },
        {
          name: "信息处理",
          color: "#fff5e6",
          border: "#d98a2b",
          items: [
            { name: "LLM 对话生成", sub: "streamChatCompletion" },
            { name: "LLM 情绪分析", sub: "analyzeSessionEmotion" },
            { name: "周报数据聚合", sub: "generateWeeklyReport" },
            { name: "测评评分计算", sub: "submitAssessment" },
            { name: "练习效果统计", sub: "getStats" },
            { name: "练习推荐引擎", sub: "recommend" }
          ]
        },
        {
          name: "信息存储",
          color: "#fde8e8",
          border: "#c04545",
          items: [
            { name: "user", sub: "用户表" },
            { name: "consultation_session / message", sub: "会话·消息表" },
            { name: "emotion_diary / ai_analysis_task", sub: "日记·AI任务表" },
            { name: "emotion_weekly_report", sub: "情绪周报表" },
            { name: "emotion_exercise / record", sub: "练习·打卡表" },
            { name: "psychological_scale / record", sub: "量表·测评表" },
            {
              name: "knowledge_category / article / favorite",
              sub: "分类·文章·收藏表"
            },
            { name: "sys_file_info", sub: "文件信息表" }
          ]
        },
        {
          name: "信息展示",
          color: "#efe8f7",
          border: "#7a5bb0",
          items: [
            { name: "前台：首页·AI咨询·情绪日记", sub: "7 大用户页面" },
            { name: "前台：情绪周报·急救箱·测评·知识库", sub: "" },
            { name: "后台：数据分析·文章管理", sub: "4 大管理页面" },
            { name: "后台：咨询记录·情绪日志", sub: "" }
          ]
        }
      ]

      /* ========== 布局参数 ========== */
      const MX = 40,
        MY = 40 // 画布边距
      const bandPad = 24 // 层内上下内边距
      const bandGap = 48 // 层间距（放箭头）
      const labelW = 130 // 左侧层标签宽度
      const cardW = 230,
        cardH = 78 // 卡片尺寸
      const cardGapX = 18 // 卡片横向间距
      const cardGapY = 14 // 卡片纵向间距

      /* ---- 计算每层卡片布局（自动换行） ---- */
      let maxCardsRow = 0
      const rows = layers.map((layer) => {
        const innerW = 2600 - MX * 2 - labelW - 20 // 可用宽度
        const cardsPerRow = Math.max(
          1,
          Math.floor((innerW + cardGapX) / (cardW + cardGapX))
        )
        if (cardsPerRow > maxCardsRow) maxCardsRow = cardsPerRow
        return cardsPerRow
      })
      const SVG_W =
        MX * 2 +
        labelW +
        20 +
        maxCardsRow * cardW +
        (maxCardsRow - 1) * cardGapX

      let yCursor = MY
      const layerBoxes = layers.map((layer, idx) => {
        const n = layer.items.length
        const cpr = rows[idx]
        const nRows = Math.ceil(n / cpr)
        const h = bandPad * 2 + nRows * cardH + (nRows - 1) * cardGapY
        const box = { y: yCursor, h, nRows, cpr }
        yCursor += h + bandGap
        return box
      })
      const SVG_H = yCursor - bandGap + MY

      /* ---- 生成 SVG ---- */
      const NS = "http://www.w3.org/2000/svg"
      const svg = document.getElementById("svg")
      svg.setAttribute("width", SVG_W)
      svg.setAttribute("height", SVG_H)
      svg.setAttribute("viewBox", `0 0 ${SVG_W} ${SVG_H}`)

      const el = (tag, attrs = {}, text) => {
        const node = document.createElementNS(NS, tag)
        for (const k in attrs) node.setAttribute(k, attrs[k])
        if (text != null) node.textContent = text
        svg.appendChild(node)
        return node
      }

      /* 层背景 + 层标签 */
      layers.forEach((layer, idx) => {
        const b = layerBoxes[idx]
        el("rect", {
          x: MX,
          y: b.y,
          width: SVG_W - MX * 2,
          height: b.h,
          rx: 10,
          fill: layer.color,
          stroke: layer.border,
          "stroke-width": 1.5,
          "stroke-dasharray": "6 3"
        })
        // 层标签
        el("rect", {
          x: MX + 14,
          y: b.y + b.h / 2 - 30,
          width: 100,
          height: 60,
          rx: 8,
          fill: "#fff",
          stroke: layer.border,
          "stroke-width": 1.5
        })
        el(
          "text",
          {
            x: MX + 64,
            y: b.y + b.h / 2,
            "text-anchor": "middle",
            "dominant-baseline": "central",
            "font-size": 22,
            "font-weight": 700,
            fill: layer.border
          },
          layer.name
        )
      })

      /* 卡片 */
      layers.forEach((layer, idx) => {
        const b = layerBoxes[idx]
        const startX = MX + labelW + 20
        layer.items.forEach((item, i) => {
          const row = Math.floor(i / b.cpr)
          const col = i % b.cpr
          const cx = startX + col * (cardW + cardGapX)
          const cy = b.y + bandPad + row * (cardH + cardGapY)
          el("rect", {
            x: cx,
            y: cy,
            width: cardW,
            height: cardH,
            rx: 6,
            fill: "#ffffff",
            stroke: layer.border,
            "stroke-width": 1.2
          })
          el(
            "text",
            {
              x: cx + cardW / 2,
              y: cy + 30,
              "text-anchor": "middle",
              "font-size": 16,
              "font-weight": 600,
              fill: "#2f343c"
            },
            item.name
          )
          if (item.sub) {
            el(
              "text",
              {
                x: cx + cardW / 2,
                y: cy + 54,
                "text-anchor": "middle",
                "font-size": 12,
                fill: "#888"
              },
              item.sub
            )
          }
        })
      })

      /* 层间向下箭头（信息流方向） */
      for (let idx = 0; idx < layers.length - 1; idx++) {
        const top = layerBoxes[idx]
        const bot = layerBoxes[idx + 1]
        const ax = SVG_W / 2
        const ay1 = top.y + top.h + 6
        const ay2 = bot.y - 6
        const mid = (ay1 + ay2) / 2
        el("line", {
          x1: ax,
          y1: ay1,
          x2: ax,
          y2: ay2 - 10,
          stroke: "#999",
          "stroke-width": 2
        })
        // 箭头
        el("polygon", {
          points: `${ax},${ay2} ${ax - 7},${ay2 - 14} ${ax + 7},${ay2 - 14}`,
          fill: "#999"
        })
        // 标签
        el(
          "text",
          { x: ax + 14, y: mid + 5, "font-size": 13, fill: "#777" },
          "信息流转 ↓"
        )
      }

      /* 工具栏 */
      document.getElementById("btnFit").onclick = () => {
        svg.style.width = "100%"
        svg.style.height = "auto"
      }
      document.getElementById("btnRaw").onclick = () => {
        svg.style.width = ""
        svg.style.height = ""
      }
      document.getElementById("btnPrint").onclick = () => window.print()
    </script>
  </body>
</html>
